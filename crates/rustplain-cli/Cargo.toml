[package]
name = "rustplain-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plain-language explanations for Rust compiler and Cargo errors."
readme = "README.md"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "rustplain"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rustplain-diag = { version = "0.1.0", path = "../rustplain-diag" }
rustplain-render = { version = "0.1.0", path = "../rustplain-render" }
rustplain-cargo = { version = "0.1.0", path = "../rustplain-cargo" }
