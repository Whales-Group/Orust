[workspace]
resolver = "2"
members = [
    "crates/orust-syntax",
    "crates/orust-lower",
    "crates/orust-emit",
    "crates/orust-diag",
    "crates/orust-cli",
    "crates/orust-lsp",
    "crates/orust-runtime",
    "crates/rustplain-diag",
    "crates/rustplain-explain",
    "crates/rustplain-render",
    "crates/rustplain-cargo",
    "crates/rustplain-cli",
    "conformance",
    "fuzz",
]


[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Whales-Group/Orust"
homepage = "https://github.com/Whales-Group/Orust"
